site_name: httpware
site_url: https://httpware.modern-python.org
repo_url: https://github.com/modern-python/httpware
docs_dir: docs
edit_uri: edit/main/docs/

nav:
  - Quick-Start: index.md
  - Resilience: resilience.md
  - Demos:
      - Overview: demos/index.md
      - Retry: demos/retry.md
      - Circuit Breaker: demos/circuit-breaker.md
      - Bulkhead: demos/bulkhead.md
      - Timeout: demos/timeout.md
      - Full stack: demos/full-stack.md
  - Errors: errors.md
  - Observability: observability.md
  - Decoders: decoders.md
  - Middleware: middleware.md
  - Testing: testing.md
  - Recipes:
      - modern-di: recipes/modern-di.md
      - Phase decorator patterns: recipes/phase-decorator-patterns.md
      - Link header pagination: recipes/link-header-pagination.md
  - Development:
      - Contributing: dev/contributing.md

theme:
  name: material
  custom_dir: overrides
  logo: assets/mark.svg
  favicon: assets/favicon.svg
  features:
    - content.code.copy
    - content.action.edit
    - navigation.footer
    - navigation.sections
    - navigation.top
    - header.autohide
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

extra_css:
  - css/brand.css
  - demos/demos.css

extra_javascript:
  - demos/engine.js

exclude_docs: |
  /agents/
  /adr/

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

markdown_extensions:
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - admonition
  - attr_list
